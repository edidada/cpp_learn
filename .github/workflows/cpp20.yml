# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: cpp20 ubuntu clang

on:
  push:
    branches: [ "cpp20" ]
  pull_request:
    branches: [ "cpp20" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Debug

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: ninja
      # 原来这两行在 Ubuntu 24.04 runner 上是坏的：源硬写成 jammy（noble 上装 jammy 包），
      # 公钥用早已废弃的 apt-key（日志里就是那句
      # "W: GPG error: https://apt.llvm.org/jammy llvm-toolchain-jammy-17 InRelease:
      #  NO_PUBKEY 15CF4D18AF4F7421"）。改成：Ubuntu 自带仓库优先，
      # 需要 apt.llvm.org 时按当前 codename 加源并用 signed-by keyring 装公钥。
      run: |
        sudo apt update
        sudo apt install ninja-build libc++-dev libc++abi-dev -y
        if ! sudo apt install -y clang-17; then
          echo "Ubuntu 仓库没有 clang-17，加 apt.llvm.org"
          CODENAME=$(. /etc/os-release && echo ${VERSION_CODENAME})
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-snapshot.gpg.keyring
          echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg.keyring] https://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-17 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt update
          sudo apt install -y clang-17
        fi
        clang++-17 --version

    - name: cp cmake
      run: rm -rf CMakeLists.txt && cp ./cmake/cpp20/CMakeLists.txt .

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: |
        cmake -G Ninja -DCMAKE_C_COMPILER=clang-17 -DCMAKE_CXX_COMPILER=clang++-17 -DCMAKE_CXX_FLAGS="-stdlib=libc++" -DCMAKE_SHARED_LINKER_FLAGS="-stdlib=libc++" -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -C ${{env.BUILD_TYPE}}

