name: Build & Test cpp23 multi conpiler version

on:
  push:
    branches: [cpp23]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Debug

jobs:
  macos:
    runs-on: macos-${{ matrix.osver }}
    strategy:
      fail-fast: false
      matrix:
        osver: [14, 15]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: cp cmake
        run: rm -rf CMakeLists.txt && cp ./cmake/cpp23/CMakeLists.txt .

      - name: Create Build Environment & Configure Cmake
        # Some projects don't allow in-source building, so create a separate build directory
        # We'll use this as our working directory for all subsequent commands
        run: |
          cmake -B build -G Ninja          \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE

      - name: Build
        # Build your program with the given configuration
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

  ubuntu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - cxx: g++
            ver: 13
          - cxx: g++
            ver: 14
          - cxx: clang++
            ver: 15
          - cxx: clang++
            ver: 16
          - cxx: clang++
            ver: 17
          - cxx: clang++
            ver: 18
          - cxx: clang++
            ver: 19
          - cxx: clang++
            ver: 20
    env:
      CXX: ${{ matrix.compiler.cxx }}-${{ matrix.compiler.ver }}
    steps:
      - name: Checkout cpp_learn source code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Clang less 13
        if: startsWith(matrix.compiler.cxx, 'clang') && matrix.compiler.ver < 13
        run: sudo apt-get install clang-${{ matrix.compiler.ver }}

      - name: Install Clang 13 above
        if: startsWith(matrix.compiler.cxx, 'clang') && matrix.compiler.ver >= 13
        # 这里原来直接跑 apt.llvm.org 的 llvm.sh，两个坑：
        #   1) apt.llvm.org 对 noble 已经不发 15/16 档了（实测 https://apt.llvm.org/noble/dists/llvm-toolchain-noble-16/Release → 404），
        #      apt 就报 "E: The repository '...' does not have a Release file." 并 exit 100
        #      —— CI 上 ubuntu (clang++, 16) 那枚 job 的死因是它，不是编译错误；
        #   2) llvm.sh 里用的 apt-key 在 Ubuntu 24.04 已废弃，还会捎带 NO_PUBKEY 警告。
        # 改成：先试 Ubuntu 自带仓库（clang-15/16/18/19 都在），拿不到再加 apt.llvm.org，
        # 并且用 signed-by keyring 的正确姿势装公钥。
        run: |
          VER=${{ matrix.compiler.ver }}
          sudo apt-get update -y
          if sudo apt-get install -y clang-${VER}; then
            echo "clang-${VER} 来自 Ubuntu 官方仓库"
            exit 0
          fi
          echo "Ubuntu 仓库里没有 clang-${VER}，改加 apt.llvm.org"
          CODENAME=$(. /etc/os-release && echo ${VERSION_CODENAME})
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-snapshot.gpg.keyring
          echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg.keyring] https://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-${VER} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -y
          sudo apt-get install -y clang-${VER}
          clang++-${VER} --version

      - name: Clang 15/16/17 改用 libc++
        if: startsWith(matrix.compiler.cxx, 'clang') && matrix.compiler.ver >= 15 && matrix.compiler.ver < 18
        # 装好 clang 之后这几档还是红，但不是 demo 的锅：ubuntu-latest(noble) 上 clang 默认搭档
        # 是 runner 自带的 libstdc++ 14，而 libstdc++ 14 的头里有 clang 18 之前解析不了的东西，
        # 实测报错（clang++-15/16/17，编的是 cpp23_barrier_main / cpp23_split / cpp23_split2）：
        #   include/c++/14/ranges:6315: error: requires clause differs in template redeclaration
        #   include/c++/14/ranges:9057: error: type-id cannot have a name   ← (auto(__x) += __y) 是 GNU 扩展
        #   include/c++/14/bits/unicode.h:591: error: constraints not satisfied for '_Utf_view'
        #   include/c++/14/bits/stl_pair.h:410: error: no matching function for call to 'get'
        # clang 自己的标准库 libc++ 才是这些老版本 clang 的正牌搭档（macOS 腿一直是 libc++，都是绿的），
        # 所以 15/16/17 三档换成 libc++，多版本覆盖度不减；18/19/20 继续用 libstdc++ 14（已实测全绿）。
        run: |
          VER=${{ matrix.compiler.ver }}
          sudo apt-get install -y --no-install-recommends libc++-${VER}-dev libc++abi-${VER}-dev
          # 只动 CXXFLAGS，不要设 LDFLAGS：project() 同时 enabled C，
          # LDFLAGS 会被 CMake 拿去测 C 编译器，cc 不认 -stdlib=libc++ 会直接 configure 失败
          # （实测报错：cc: error: unrecognized command-line option '-stdlib=libc++'）。
          # 链接阶段 CMake 会把 CXX flags 带进 C++ 目标的 link 行，
          # 而 Debian 的 libc++ 包装好了自动带上 libc++abi/libunwind，不需要额外 -lc++abi。
          FLAGS="-stdlib=libc++"
          if [ "$VER" -lt 16 ]; then
            # libc++ 15 把 <ranges> 整套放在实验区，不加 -fexperimental-library 连 std::views 都看不到
            # （实测：error: no member named 'views' in namespace 'std'）。16/17 已转正，不需要这个开关。
            FLAGS="$FLAGS -fexperimental-library"
          fi
          echo "CXXFLAGS=$FLAGS" >> "$GITHUB_ENV"
          clang++-${VER} --version
          printf '#include <memory>\n#include <stdexcept>\n#include <vector>\nint main(){auto p=std::make_unique<std::vector<int>>();try{throw std::runtime_error("x");}catch(...){}return (int)p->size();}\n' | clang++-${VER} $FLAGS -std=c++2b -x c++ - -o /tmp/libcxx_smoke && echo "libc++-${VER} 冒烟通过（能编译能链接）"

      - name: Install g++ 13 above
        if: startsWith(matrix.compiler.cxx, 'g++') && matrix.compiler.ver >= 13
        run: |
          echo "ppa:ubuntu-toolchain-r/test"
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test
          echo "apt update"
          sudo apt update
          echo "gcc-pin"
          sudo cp ${{github.workspace}}/apt/gcc-pin /etc/apt/preferences.d/gcc-pin
          cat /etc/apt/preferences.d/gcc-pin
          echo "apt update"
          sudo apt update
          echo "apt-get install gcc"
          sudo apt-get install gcc-${{ matrix.compiler.ver }} g++-${{ matrix.compiler.ver }}
          echo "update-alternatives install"
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ matrix.compiler.ver }} 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${{ matrix.compiler.ver }} 100
          echo "gcc version config"
          sudo update-alternatives --config gcc
          sudo update-alternatives --config g++
          echo "gcc version"
          gcc --version
          g++ --version

      - name: cp CMakeLists.txt
        run: rm -rf CMakeLists.txt && cp ./cmake/cpp23/CMakeLists.txt .

      - name: Configure CMake
        # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
        # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build
        # Build your program with the given configuration
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

