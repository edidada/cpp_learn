name: Build & Test

on:
  push:
    branches: [cpp23]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Debug

jobs:
  macos:
    runs-on: macos-${{ matrix.osver }}
    strategy:
      fail-fast: false
      matrix:
        osver: [12, 13, 14, 15]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: cp cmake
        run: rm -rf CMakeLists.txt && cp ./cmake/cpp23/CMakeLists.txt .

      - name: Create Build Environment & Configure Cmake
        # Some projects don't allow in-source building, so create a separate build directory
        # We'll use this as our working directory for all subsequent commands
        run: |
          cmake -B build -G Ninja          \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DBUILD_TESTING=on             \
            -DUSE_SPDLOG=ON                \
            -DBUILD_SHARED_LIBS=OFF

      - name: Build
        # Build your program with the given configuration
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

  ubuntu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        link: [SHARED, STATIC]
        compiler:
          - cxx: g++
            ver: 9
          - cxx: g++
            ver: 10
          - cxx: g++
            ver: 11
          - cxx: g++
            ver: 12
          - cxx: g++
            ver: 13
          - cxx: g++
            ver: 14
          - cxx: g++
            ver: 15
          - cxx: clang++
            ver: 11
          - cxx: clang++
            ver: 12
          - cxx: clang++
            ver: 13
          - cxx: clang++
            ver: 14
          - cxx: clang++
            ver: 15
          - cxx: clang++
            ver: 16
          - cxx: clang++
            ver: 17
          - cxx: clang++
            ver: 18
          - cxx: clang++
            ver: 19
        include:
          - link: STATIC
            compiler:
              cxx: g++
              ver: 13
              feature: coroutines
    env:
      CXX: ${{ matrix.compiler.cxx }}-${{ matrix.compiler.ver }}
    steps:
      - name: Checkout Drogon source code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Clang
        if: startsWith(matrix.compiler.cxx, 'clang') && matrix.compiler.ver < 13
        run: sudo apt-get install clang-${{ matrix.compiler.ver }}

      - name: Install Clang
        if: startsWith(matrix.compiler.cxx, 'clang') && matrix.compiler.ver >= 13
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x ./llvm.sh
          sudo ./llvm.sh ${{ matrix.compiler.ver }}

      - name: cp cmake
        run: rm -rf CMakeLists.txt && cp ./cmake/cpp23/CMakeLists.txt .

      - name: Configure CMake
        # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
        # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build
        # Build your program with the given configuration
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

